[tool.pytest.ini_options]
testpaths = ["core", "hooks", "scripts"]
pythonpath = [".", "hooks"]

[tool.black]
line-length = 110

[tool.mypy]
python_version = "3.10"
files = ["core", "hooks", "scripts"]
ignore_missing_imports = true
check_untyped_defs = true
explicit_package_bases = true
mypy_path = "."
